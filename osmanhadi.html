<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jummah Bayan App - Weekly Islamic Topics</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22></text></svg>">
    <style>
        :root {
            --islamic-green: #2e7d32;
            --islamic-green-light: #4caf50;
            --islamic-blue: #1976d2;
            --islamic-blue-light: #2196f3;
            --islamic-gold: #ffb300;
            --text-dark: #333333;
            --text-light: #666666;
            --bg-light: #f8f9fa;
            --bg-white: #ffffff;
            --border-radius: 12px;
            --shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 8px 25px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.6;
            max-width: 100%;
            overflow-x: hidden;
        }

        .app-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 15px;
        }

        /* Header Styles */
        header {
            background: linear-gradient(135deg, var(--islamic-green), var(--islamic-blue));
            color: white;
            padding: 1.5rem 0;
            text-align: center;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%23007d32' fill-opacity='0.1' fill-rule='evenodd'/%3E%3C/svg%3E");
            opacity: 0.3;
        }

        .header-content {
            position: relative;
            z-index: 1;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }

        .logo-icon {
            font-size: 2.5rem;
            margin-right: 10px;
        }

        .logo-text {
            font-family: 'Amiri', serif;
            font-size: 1.8rem;
            font-weight: 700;
        }

        .subtitle {
            font-size: 1rem;
            opacity: 0.9;
            font-weight: 300;
            margin-top: 5px;
        }

        /* Ad Placeholders */
        .ad-placeholder {
            background-color: #f1f1f1;
            border-radius: var(--border-radius);
            padding: 15px;
            text-align: center;
            margin: 20px auto;
            border: 1px dashed #cccccc;
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .ad-label {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Main Content Styles */
        .main-content {
            padding: 10px 0 40px;
        }

        .section-title {
            font-family: 'Amiri', serif;
            font-size: 1.6rem;
            color: var(--islamic-green);
            margin-bottom: 20px;
            text-align: center;
            position: relative;
            padding-bottom: 10px;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background-color: var(--islamic-gold);
            border-radius: 3px;
        }

        /* Bayan List Styles */
        .bayan-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }

        .bayan-item {
            background-color: var(--bg-white);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: flex-start;
            transition: var(--transition);
            cursor: pointer;
            border-left: 4px solid var(--islamic-green);
        }

        .bayan-item:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
            border-left-color: var(--islamic-blue);
        }

        .bayan-number {
            background-color: var(--islamic-green);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .bayan-content {
            flex: 1;
        }

        .bayan-title {
            font-family: 'Amiri', serif;
            font-size: 1.4rem;
            color: var(--islamic-green);
            margin-bottom: 8px;
            font-weight: 700;
        }

        .bayan-description {
            color: var(--text-light);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .bayan-icon {
            color: var(--islamic-blue);
            font-size: 1.5rem;
            margin-left: 10px;
            flex-shrink: 0;
            align-self: center;
        }

        /* Detail Page Styles */
        .detail-page {
            display: none;
            background-color: var(--bg-white);
            border-radius: var(--border-radius);
            padding: 25px;
            box-shadow: var(--shadow);
            margin-top: 20px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            background-color: var(--islamic-green);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 50px;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 20px;
            transition: var(--transition);
        }

        .back-button:hover {
            background-color: var(--islamic-green-light);
            transform: translateX(-3px);
        }

        .back-button i {
            margin-right: 8px;
        }

        .detail-header {
            margin-bottom: 25px;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
        }

        .detail-title {
            font-family: 'Amiri', serif;
            font-size: 1.8rem;
            color: var(--islamic-green);
            margin-bottom: 10px;
        }

        .detail-number {
            display: inline-block;
            background-color: var(--islamic-blue-light);
            color: white;
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .detail-content {
            font-size: 1.05rem;
            line-height: 1.7;
            color: var(--text-dark);
        }

        .detail-content p {
            margin-bottom: 15px;
        }

        .detail-content h3 {
            font-family: 'Amiri', serif;
            color: var(--islamic-blue);
            margin: 20px 0 10px;
        }

        .detail-content ul {
            padding-left: 20px;
            margin-bottom: 15px;
        }

        .detail-content li {
            margin-bottom: 8px;
        }

        .quote {
            background-color: #f0f7ff;
            border-left: 4px solid var(--islamic-blue);
            padding: 15px;
            margin: 20px 0;
            border-radius: 0 var(--border-radius) var(--border-radius) 0;
            font-style: italic;
        }

        /* Footer Styles */
        footer {
            background-color: var(--islamic-green);
            color: white;
            padding: 25px 0;
            text-align: center;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            margin-top: 40px;
        }

        .footer-content {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 15px;
        }

        .footer-logo {
            font-family: 'Amiri', serif;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin: 15px 0;
        }

        .footer-links a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            transition: var(--transition);
        }

        .footer-links a:hover {
            color: white;
            text-decoration: underline;
        }

        .copyright {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-top: 20px;
        }

        /* Responsive Styles */
        @media (max-width: 600px) {
            .bayan-item {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .bayan-number {
                margin-bottom: 15px;
            }
            
            .bayan-icon {
                align-self: flex-end;
                margin-top: 15px;
            }
            
            .detail-title {
                font-size: 1.5rem;
            }
            
            .footer-links {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>

    <!-- Main Application Script -->
    <script>
        // Sample Bayan Data
        const bayanData = [
            {
                id: 1,
                number: "01",
                title: "The Importance of Patience in Trials",
                description: "Understanding sabr during difficult times as a test from Allah and a means of spiritual growth.",
                icon: "fas fa-heart",
                content: `
                    <p>Patience (sabr) is a fundamental virtue in Islam that is repeatedly emphasized in the Quran and Sunnah. In times of trials and difficulties, patience becomes a shield for the believer and a means of drawing closer to Allah.</p>
                    
                    <h3>Types of Patience in Islam</h3>
                    <ul>
                        <li><strong>Patience in obedience to Allah:</strong> Remaining steadfast in performing acts of worship even when it becomes challenging.</li>
                        <li><strong>Patience in avoiding disobedience:</strong> Resisting temptations and sins even when the desire is strong.</li>
                        <li><strong>Patience during trials:</strong> Accepting Allah's decree during times of hardship without complaint.</li>
                    </ul>
                    
                    <div class="quote">
                        "O you who have believed, seek help through patience and prayer. Indeed, Allah is with the patient." (Quran 2:153)
                    </div>
                    
                    <h3>Benefits of Patience</h3>
                    <p>Allah promises great rewards for those who exercise patience. The Quran states that Allah is with the patient, and they will receive their reward without measure. Patience purifies the soul, strengthens faith, and elevates one's status in the sight of Allah.</p>
                    
                    <h3>Practical Steps to Cultivate Patience</h3>
                    <p>1. Remember that trials are tests from Allah<br>
                    2. Reflect on the rewards promised to the patient<br>
                    3. Seek help through prayer and remembrance of Allah<br>
                    4. Look at those who have fewer blessings than you<br>
                    5. Understand that every difficulty eventually passes</p>
                `
            },
            {
                id: 2,
                number: "02",
                title: "Gratitude: The Key to Increase in Blessings",
                description: "How shukr transforms our relationship with Allah and multiplies our blessings.",
                icon: "fas fa-hands-praying",
                content: `
                    <p>Gratitude (shukr) is not merely saying "Alhamdulillah"; it is a comprehensive state of being that encompasses recognition of blessings, acknowledgment of the Bestower, and proper utilization of those blessings in ways pleasing to Allah.</p>
                    
                    <h3>The Three Components of Shukr</h3>
                    <ul>
                        <li><strong>Shukr of the heart:</strong> Recognizing and acknowledging that all blessings come from Allah alone.</li>
                        <li><strong>Shukr of the tongue:</strong) Expressing gratitude through words of praise and remembrance.</li>
                        <li><strong>Shukr of the limbs:</strong> Using one's blessings in obedience to Allah and avoiding their use in disobedience.</li>
                    </ul>
                    
                    <div class="quote">
                        "And [remember] when your Lord proclaimed, 'If you are grateful, I will surely increase you [in favor]; but if you deny, indeed, My punishment is severe.'" (Quran 14:7)
                    </div>
                    
                    <h3>The Reciprocal Nature of Gratitude</h3>
                    <p>Allah promises to increase blessings for those who are grateful. This increase may come in various forms - sometimes as more of the same blessing, sometimes as different blessings, and sometimes as barakah (blessing) in what we already have.</p>
                    
                    <h3>Daily Practices for Cultivating Gratitude</h3>
                    <p>1. Begin each day with Alhamdulillah upon waking<br>
                    2. Count and reflect upon at least 5 blessings daily<br>
                    3. Express gratitude to people as a form of gratitude to Allah<br>
                    4. Use your blessings to help others<br>
                    5. Perform voluntary acts of worship to show appreciation</p>
                `
            },
            {
                id: 3,
                number: "03",
                title: "Purification of the Heart from Envy",
                description: "Understanding hasad and its destructive effects on faith and community bonds.",
                icon: "fas fa-hand-holding-heart",
                content: `
                    <p>Envy (hasad) is a destructive disease of the heart that corrodes faith, corrupts actions, and severs relationships. It involves feeling discontent at the blessings bestowed upon others and wishing for their removal.</p>
                    
            <h3>Types of Envy</h3>
                    <ul>
                        <li><strong>Prohibited envy:</strong> Wishing for the removal of blessings from others.</li>
                        <li><strong>Permissible competitive spirit (ghibtah):</strong> Wishing to have similar blessings without wanting them removed from others.</li>
                    </ul>
                    
                    <div class="quote">
                        "Beware of envy, for envy consumes good deeds just as fire consumes wood." (Prophet Muhammad )
                    </div>
                    
                    <h3>Effects of Envy on the Individual and Community</h3>
                    <p>Envy leads to inner turmoil, dissatisfaction with Allah's decree, and often manifests in harmful speech or actions toward others. It destroys brotherhood/sisterhood in the community and prevents collective progress.</p>
                    
                    <h3>Cures for Envy</h3>
                    <p>1. Recognize that all provisions are from Allah alone<br>
                    2. Understand that blessings are tests - both having them and not having them<br>
                    3. Make dua for the person you envy - this transforms envy into love<br>
                    4. Focus on your own blessings rather than what others have<br>
                    5. Reflect on the transient nature of worldly possessions</p>
                `
            },
            {
                id: 4,
                number: "04",
                title: "The Excellence of Friday and Its Etiquettes",
                description: "Maximizing the blessings of Jummah through proper observance of its sunnah.",
                icon: "fas fa-mosque",
                content: `
                    <p>Friday (Jummah) holds a special status in Islam. It is the best day of the week, containing an hour when dua is accepted, and it is obligatory for Muslim men to attend the Jummah prayer.</p>
                    
                    <h3>Special Virtues of Friday</h3>
                    <ul>
                        <li>It is the master of days and the most virtuous day in the sight of Allah.</li>
                        <li>Adam (AS) was created on Friday, entered Paradise on Friday, and was expelled from it on Friday.</li>
                        <li>The Hour will be established on Friday.</li>
                        <li>There is a time on Friday when Allah grants the requests of His servants.</li>
                    </ul>
                    
                    <div class="quote">
                        "The best day on which the sun has risen is Friday; on it Adam was created, on it he was made to enter Paradise, on it he was expelled from it, and the Hour will be established on no other day than Friday." (Prophet Muhammad )
                    </div>
                    
                    <h3>Jummah Etiquettes and Sunan</h3>
                    <p>1. Perform ghusl (ritual bath) before the prayer<br>
                    2. Wear clean clothes and apply perfume (for men)<br>
                    3. Go early to the mosque<br>
                    4. Listen attentively to the khutbah without talking<br>
                    5. Recite Surah Al-Kahf on Friday<br>
                    6. Send abundant blessings upon the Prophet <br>
                    7. Make abundant dua, especially during the last hour of the day</p>
                    
                    <h3>The Friday Prayer Structure</h3>
                    <p>The Jummah prayer consists of two rak'ahs preceded by a two-part khutbah (sermon). The khutbah is an integral part of the prayer, and talking during it invalidates one's Jummah. It is recommended to make dua between the two parts of the khutbah.</p>
                `
            },
            {
                id: 5,
                number: "05",
                title: "Building a Connection with the Quran",
                description: "Practical steps to transform our relationship with the Book of Allah.",
                icon: "fas fa-book-quran",
                content: `
                    <p>The Quran is not merely a book to be recited; it is a guide, a healing, and a mercy for those who establish a living relationship with it. Developing a strong connection with the Quran is essential for spiritual growth and success in both worlds.</p>
                    
                    <h3>Levels of Interaction with the Quran</h3>
                    <ul>
                        <li><strong>Recitation (Tilawah):</strong> Reading the words with proper tajweed.</li>
                        <li><strong>Understanding (Tafakkur):</strong> Reflecting on the meanings and messages.</li>
                        <li><strong>Implementation (Tatbeeq):</strong> Applying the teachings in daily life.</li>
                        <li><strong>Dissemination (Tableegh):</strong> Sharing the message with others.</li>
                    </ul>
                    
                    <div class="quote">
                        "This is the Book about which there is no doubt, a guidance for those conscious of Allah." (Quran 2:2)
                    </div>
                    
                    <h3>Practical Steps to Connect with the Quran</h3>
                    <p>1. Set a daily time for Quran reading - consistency is more important than quantity<br>
                    2. Begin with understanding - read translation and tafsir alongside recitation<br>
                    3. Memorize at least a few verses each week<br>
                    4. Listen to beautiful recitations regularly<br>
                    5. Implement one teaching from the Quran each week in your life</p>
                    
                    <h3>Overcoming Common Challenges</h3>
                    <p>Many struggle with maintaining consistency in Quran reading. The key is to start small, be realistic about goals, and focus on quality over quantity. Even a few verses read with reflection are better than an entire juz read without understanding.</p>
                `
            },
            {
                id: 6,
                number: "06",
                title: "The Power of Sincere Repentance",
                description: "Understanding tawbah and how to return to Allah after mistakes.",
                icon: "fas fa-person-praying",
                content: `
                    <p>Repentance (tawbah) is the act of returning to Allah after committing a sin. It is a beautiful mercy from Allah that the door of repentance remains open until the sun rises from the west or until the soul reaches the throat at death.</p>
                    
                    <h3>Conditions of Accepted Repentance</h3>
                    <ul>
                        <li>Sincerely regretting the sin committed.</li>
                        <li>Immediately ceasing the sinful action.</li>
                        <li>Determining never to return to the sin.</li>
                        <li>Restoring the rights of others if the sin involved wrongdoing against people.</li>
                    </ul>
                    
                    <div class="quote">
                        "O you who have believed, repent to Allah with sincere repentance. Perhaps your Lord will remove from you your misdeeds and admit you into gardens beneath which rivers flow." (Quran 66:8)
                    </div>
                    
                    <h3>Allah's Joy at the Repentance of His Servant</h3>
                    <p>Prophet Muhammad  said: "Allah is more delighted with the repentance of His servant than one of you would be if he found his lost camel in a barren desert." This shows the immense love and mercy Allah has for those who turn back to Him.</p>
                    
                    <h3>Practical Steps for Effective Repentance</h3>
                    <p>1. Perform wudu and pray two rak'ahs of repentance<br>
                    2. Make sincere dua asking Allah for forgiveness<br>
                    3. Increase in good deeds to erase bad ones<br>
                    4. Avoid the places and people that lead to sin<br>
                    5. Remember that Allah's mercy encompasses all things</p>
                `
            }
        ];

        // DOM Elements
        const bayanListElement = document.getElementById('bayan-list');
        const detailPageElement = document.getElementById('detail-page');
        const mainContentElement = document.querySelector('.main-content');

        // Function to render bayan list
        function renderBayanList() {
            bayanListElement.innerHTML = '';
            
            bayanData.forEach(bayan => {
                const bayanItem = document.createElement('div');
                bayanItem.className = 'bayan-item';
                bayanItem.setAttribute('data-id', bayan.id);
                
                bayanItem.innerHTML = `
                    <div class="bayan-number">${bayan.number}</div>
                    <div class="bayan-content">
                        <h3 class="bayan-title">${bayan.title}</h3>
                        <p class="bayan-description">${bayan.description}</p>
                    </div>
                    <div class="bayan-icon">
                        <i class="${bayan.icon}"></i>
                    </div>
                `;
                
                bayanItem.addEventListener('click', () => showBayanDetail(bayan.id));
                bayanListElement.appendChild(bayanItem);
            });
        }

        // Function to show bayan detail
        function showBayanDetail(id) {
            const bayan = bayanData.find(item => item.id === id);
            
            if (!bayan) return;
            
            // Update detail page content
            detailPageElement.innerHTML = `
                <button class="back-button" id="back-button">
                    <i class="fas fa-arrow-left"></i> Back to Topics
                </button>
                <div class="detail-header">
                    <span class="detail-number">${bayan.number}</span>
                    <h2 class="detail-title">${bayan.title}</h2>
                </div>
                <div class="detail-content">
                    ${bayan.content}
                </div>
            `;
            
            // Show detail page and hide list
            detailPageElement.style.display = 'block';
            bayanListElement.style.display = 'none';
            document.querySelector('.section-title').style.display = 'none';
            document.getElementById('in-content-ad').style.display = 'none';
            
            // Add event listener to back button
            document.getElementById('back-button').addEventListener('click', goBackToList);
            
            // Scroll to top of detail page
            detailPageElement.scrollIntoView({ behavior: 'smooth' });
        }

        // Function to go back to list view
        function goBackToList() {
            detailPageElement.style.display = 'none';
            bayanListElement.style.display = 'flex';
            document.querySelector('.section-title').style.display = 'block';
            document.getElementById('in-content-ad').style.display = 'block';
            
            // Scroll back to top of list
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Initialize the app
        document.addEventListener('DOMContentLoaded', () => {
            renderBayanList();
            
            // Add touch-friendly enhancements
            document.querySelectorAll('.bayan-item').forEach(item => {
                item.addEventListener('touchstart', function() {
                    this.style.transform = 'translateY(-2px)';
                });
                
                item.addEventListener('touchend', function() {
                    this.style.transform = 'translateY(0)';
                });
            });
              // WebView navigation support
            if (window.androidBridge) {
                // If running in Android WebView with bridge
                window.androidBridge.onBackPressed = function() {
                    if (detailPageElement.style.display === 'block') {
                        goBackToList();
                        return true; // Handled back button
                    }
                    return false; // Let system handle
                };
            }
        });

        // WebView utility function for future Android app integration
        function webViewNavigate(page) {
            if (window.androidBridge && window.androidBridge.navigate) {
                window.androidBridge.navigate(page);
            } else {
                // Fallback for browser testing
                console.log(`Would navigate to: ${page}`);
            }
        }
    </script>
</body>
